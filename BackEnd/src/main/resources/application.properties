spring.application.name=System
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spirng.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_management?useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.mvc.cors.allowed-origins=http://localhost:8080
spring.mvc.cors.allowed-methods=GET,POST
spring.mvc.cors.allowed-headers=*
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

